  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#3FD0CB" stroke-opacity=".06"/></pattern>
 </defs>
 <rect width="1200" height="630" fill="url(#bg)"/>
