name: Static site checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check
      - run: npx playwright install --with-deps chromium
      - run: npm test
        env:
          RUMIWARE_SCREENSHOTS_DIR: verification/phase3/phase1-regression
          RUMIWARE_PHASE2_SCREENSHOTS_DIR: verification/phase3/phase2-regression
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: verification-failure
          path: |
            test-results/
            verification/phase3/
